version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vitaloop_pg
    environment:
      POSTGRES_DB: vitaloop_upa
      POSTGRES_USER: vitaloop_admin
      POSTGRES_PASSWORD: vitaloop_secret_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitaloop_admin -d vitaloop_upa"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitaloop_api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://vitaloop_admin:vitaloop_secret_pass@postgres:5432/vitaloop_upa
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
